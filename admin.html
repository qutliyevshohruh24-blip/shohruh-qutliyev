
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shohruh AI — Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#090d19;--panel:#121a2b;--line:#29354c;--text:#f4f6ff;--muted:#9aa9c4;--accent:#8878ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top left,#24335d,transparent 45%),var(--bg);color:var(--text);font:15px Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:12px 15px;background:linear-gradient(100deg,#7764fa,#218ee8);color:white;font-weight:700}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0b1221;color:white}
label{display:block;font-size:13px;color:var(--muted);margin:13px 0 7px}
#loginView{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:440px;background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:22px}
.muted{color:var(--muted);line-height:1.6}
.notice{padding:12px;border-radius:10px;background:#172238;margin-top:14px;line-height:1.5}
.error{color:#ff9eaa}.success{color:#85efc0}
.hidden{display:none!important}
</style>
</head>
<body>
<section id="loginView">
  <div class="card">
    <h1>Shohruh AI — Admin</h1>
    <p class="muted">Administrator uchun email orqali tasdiqlash.</p>

    <form id="emailForm">
      <label for="email">Email manzilingiz</label>
      <input id="email" type="email" required
             autocomplete="username"
             placeholder="Email manzilingiz">
      <button id="sendButton" style="width:100%;margin-top:18px">
        Tasdiqlash kodini yuborish
      </button>
    </form>

    <form id="otpForm" class="hidden">
      <label for="otp">Emailga kelgan 6 xonali kod</label>
      <input id="otp" inputmode="numeric"
             autocomplete="one-time-code"
             pattern="[0-9]{6}" maxlength="6" required
             placeholder="123456">
      <button id="verifyButton" style="width:100%;margin-top:18px">
        Kodni tasdiqlash
      </button>
    </form>

    <div id="message" class="notice">
      Ulanish tekshirilmoqda...
    </div>
  </div>
</section>

<section id="adminView" class="hidden" style="padding:25px">
  <h1>Admin panel</h1>
  <p id="userEmail"></p>
  <p class="muted">
    Administrator sifatida tizimga kirdingiz.
  </p>
  <button id="logoutButton">Chiqish</button>
</section>

<script>
(() => {
  const SUPABASE_URL =
    "https://gyepttxiqngvkhfqqsma.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_QgQHdQcF5_ZiotKSBxU74A_BLtrsTYt";

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    }
  );

  const $ = id => document.getElementById(id);

  function showMessage(text, type = "") {
    $("message").textContent = text;
    $("message").className = "notice " + type;
  }

  function friendlyError(error) {
    const text = error?.message || "Noma’lum xatolik.";

    if (/rate limit|too many requests/i.test(text)) {
      return "Email limiti tugagan. Biroz kutib qayta urinib ko‘ring.";
    }

    return text;
  }

  async function openAdmin(user) {
    const { data, error } = await client
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      await client.auth.signOut();
      throw new Error(
        "Bu hisob administrator sifatida ruxsat etilmagan."
      );
    }

    $("loginView").classList.add("hidden");
    $("adminView").classList.remove("hidden");
    $("userEmail").textContent = user.email || "";
  }

  $("emailForm").addEventListener("submit", async event => {
    event.preventDefault();

    const email = $("email").value.trim().toLowerCase();
    $("sendButton").disabled = true;
    showMessage("Kod yuborilmoqda...");

    try {
      const { error } = await client.auth.signInWithOtp({
        email,
        options: {
          shouldCreateUser: false
        }
      });

      if (error) throw error;

      $("emailForm").classList.add("hidden");
      $("otpForm").classList.remove("hidden");

      showMessage(
        "Emailni tekshiring va 6 xonali kodni kiriting.",
        "success"
      );
      $("otp").focus();
    } catch (error) {
      showMessage(
        "Kod yuborilmadi: " + friendlyError(error),
        "error"
      );
    } finally {
      $("sendButton").disabled = false;
    }
  });

  $("otpForm").addEventListener("submit", async event => {
    event.preventDefault();

    const email = $("email").value.trim().toLowerCase();
    const token = $("otp").value.trim();

    if (!/^[0-9]{6}$/.test(token)) {
      showMessage("6 xonali kodni kiriting.", "error");
      return;
    }

    $("verifyButton").disabled = true;
    showMessage("Kod tekshirilmoqda...");

    try {
      const { data, error } = await client.auth.verifyOtp({
        email,
        token,
        type: "email"
      });

      if (error) throw error;

      await openAdmin(data.user);
    } catch (error) {
      await client.auth.signOut();

      showMessage(
        "Kirish amalga oshmadi: " + friendlyError(error),
        "error"
      );
    } finally {
      $("verifyButton").disabled = false;
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    await client.auth.signOut();
    $("adminView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
    $("emailForm").classList.remove("hidden");
    $("otpForm").classList.add("hidden");
    $("otp").value = "";
  });

  async function initialize() {
    showMessage("Supabase bilan ulanish tekshirilmoqda...");

    const { data, error } = await client.auth.getSession();

    if (error) throw error;

    if (data.session?.user) {
      await openAdmin(data.session.user);
    } else {
      showMessage(
        "Emailingizni kiriting va tasdiqlash kodini oling.",
        "success"
      );
    }
  }

  initialize().catch(error => {
    showMessage(
      "Ulanish xatosi: " + friendlyError(error),
      "error"
    );
  });
})();
</script>
</body>
</html>
